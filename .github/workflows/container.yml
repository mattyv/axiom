name: Container Build

on:
  push:
    branches: [main, 'rc/**']
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: podman build -t ghcr.io/mattyv/axiom:${{ github.sha }} -f containers/Containerfile .

      - name: Test Python imports
        run: |
          podman run --rm --entrypoint python ghcr.io/mattyv/axiom:${{ github.sha }} \
            -c "from axiom.models import Axiom; print('OK')"

      - name: Push
        run: |
          podman push ghcr.io/mattyv/axiom:${{ github.sha }}
          podman tag ghcr.io/mattyv/axiom:${{ github.sha }} ghcr.io/mattyv/axiom:latest
          podman push ghcr.io/mattyv/axiom:latest
